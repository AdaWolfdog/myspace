<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2b45"/>
      <stop offset="100%" stop-color="#1a121f"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c110a"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="10" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="45" stroke="#7a528a" stroke-width="1.5" fill="none"/>

  <!-- Hair back -->
  <path d="M 22 45 C 20 75, 30 90, 35 100 L 65 100 C 70 90, 80 75, 78 45 Z" fill="url(#hair)"/>

  <!-- Face -->
  <path d="M 32 38 C 32 25, 68 25, 68 38 C 68 58, 62 70, 50 72 C 38 70, 32 58, 32 38 Z" fill="#f5d6c6"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="42" rx="3" ry="2" fill="#2c3e50"/>
  <ellipse cx="57" cy="42" rx="3" ry="2" fill="#2c3e50"/>
  <circle cx="44" cy="41" r="0.8" fill="#fff"/>
  <circle cx="58" cy="41" r="0.8" fill="#fff"/>

  <!-- Eyebrows -->
  <path d="M 39 38 Q 43 36 47 38" stroke="#3a2312" stroke-width="1" fill="none"/>
  <path d="M 53 38 Q 57 36 61 38" stroke="#3a2312" stroke-width="1" fill="none"/>

  <!-- Lips -->
  <path d="M 45 58 Q 50 62 55 58" stroke="#b85b6c" stroke-width="1.5" fill="none"/>

  <!-- Hair front & tiara -->
  <path d="M 30 35 C 35 18, 65 18, 70 35 C 65 28, 35 28, 30 35 Z" fill="url(#hair)"/>
  <!-- Evenstar tiara -->
  <path d="M 35 30 L 50 35 L 65 30 L 50 24 Z" fill="none" stroke="#e0e8f0" stroke-width="1.5" filter="url(#glow)"/>
  <polygon points="50,22 53,28 50,34 47,28" fill="#e2f3ff" filter="url(#glow)"/>
  <circle cx="50" cy="38" r="2" fill="#ffffff" filter="url(#glow)"/>
</svg>
