<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg-denethor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2b28"/>
      <stop offset="100%" stop-color="#191010"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3b38"/>
      <stop offset="100%" stop-color="#241a18"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="10" fill="url(#bg-denethor)"/>
  <circle cx="50" cy="50" r="45" stroke="#7a5852" stroke-width="1.5" fill="none"/>

  <!-- Dark Graying Hair Back -->
  <path d="M 22 42 C 20 70, 26 88, 30 95 L 70 95 C 74 88, 80 70, 78 42 Z" fill="#3a3838"/>

  <!-- Dark Robe / Shoulders -->
  <path d="M 20 100 L 32 75 L 50 82 L 68 75 L 80 100 Z" fill="url(#robe)"/>
  <path d="M 50 82 L 50 100" stroke="#8a7268" stroke-width="1.5"/>

  <!-- Face -->
  <path d="M 34 36 C 34 24, 66 24, 66 36 C 66 58, 61 70, 50 72 C 39 70, 34 58, 34 36 Z" fill="#ebd2be"/>

  <!-- Dark graying hair strands / front -->
  <path d="M 25 38 C 30 22, 70 22, 75 38 C 65 28, 35 28, 25 38 Z" fill="#524e4d"/>
  <path d="M 28 35 C 32 48, 33 65, 30 75" stroke="#888280" stroke-width="1.5" fill="none"/>
  <path d="M 72 35 C 68 48, 67 65, 70 75" stroke="#888280" stroke-width="1.5" fill="none"/>

  <!-- Stern eyebrows -->
  <path d="M 38 41 L 47 44" stroke="#332c2a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 62 41 L 53 44" stroke="#332c2a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes - dark and solemn -->
  <circle cx="43" cy="47" r="2" fill="#221c1a"/>
  <circle cx="57" cy="47" r="2" fill="#221c1a"/>

  <!-- Nose -->
  <path d="M 50 46 L 48 56 L 53 56" stroke="#cbb09c" stroke-width="1.5" fill="none"/>

  <!-- Downturned / Stern Mouth -->
  <path d="M 43 64 Q 50 61 57 64" stroke="#9e6258" stroke-width="1.8" fill="none"/>

  <!-- Silver Steward Circlet -->
  <path d="M 33 32 Q 50 27 67 32" stroke="#c0c0c0" stroke-width="2" fill="none"/>
  <polygon points="50,25 48,29 52,29" fill="#e0e0e0"/>
</svg>