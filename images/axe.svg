<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6e6e6"/>
      <stop offset="50%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5229"/>
      <stop offset="100%" stop-color="#42220c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Wooden Handle -->
    <rect x="56" y="15" width="8" height="95" rx="3" fill="url(#wood)" transform="rotate(-25 60 60)"/>
    <!-- Leather Wrap -->
    <rect x="55" y="65" width="10" height="25" rx="1" fill="#2b1a0e" transform="rotate(-25 60 60)"/>

    <!-- Axe Head Center Binding -->
    <rect x="48" y="22" width="16" height="18" rx="2" fill="#555" transform="rotate(-25 60 60)"/>
    <circle cx="56" cy="31" r="3" fill="#d4af37" transform="rotate(-25 60 60)"/>

    <!-- Left Blade -->
    <path d="M 49 22 C 30 10, 15 25, 20 45 C 32 40, 42 35, 49 38 Z" fill="url(#metal)" stroke="#222" stroke-width="1" transform="rotate(-25 60 60)"/>
    <!-- Right Blade -->
    <path d="M 63 22 C 82 10, 97 25, 92 45 C 80 40, 70 35, 63 38 Z" fill="url(#metal)" stroke="#222" stroke-width="1" transform="rotate(-25 60 60)"/>
  </g>
</svg>